# 复制到 config/workstation.yaml 后修改。该文件已在 .gitignore 中。
# 注意：不要在任何代码或提交中包含真实 token。

home: runtime                 # 等价于 WORKSTATION_HOME；绝对路径亦可

api:
  host: 127.0.0.1             # 仅本机。切勿改为 0.0.0.0
  port: 7860
  # auth_token 从环境变量 WORKSTATION_API_TOKEN 读取，不写在此处
  allowed_origins:
    - http://127.0.0.1:7860
    - http://localhost:7860

# 模型名取自三个项目代码中真实出现的型号，不是臆测值：
#   research_agent -> deepseek-flash；knowledge -> deepseek-v4-flash-vision-exp
#   PPTAgent       -> deepseek-flash / deepseek-v4-flash / deepseek-v4-pro
#                     glm-5.3 / glm-5.3-flash
# DeepSeek 是默认车道；GLM 只对知识库死了，PPTAgent 仍在用，故保留为备用车道。
model:
  default_route: chat
  providers:
    deepseek:
      base_url: https://api.deepseek.com/v1
      api_key_env: WORKSTATION_DEEPSEEK_API_KEY
      read_timeout_seconds: 30
    glm:
      base_url: https://open.bigmodel.cn/api/paas/v4
      api_key_env: WORKSTATION_GLM_API_KEY
      read_timeout_seconds: 60

  models:
    deepseek-flash:        { provider: deepseek }
    deepseek-v4-flash:     { provider: deepseek }
    deepseek-v4-pro:       { provider: deepseek }
    # 视觉模型：会把本地图片字节发往云端，必须经 net 权限放行
    deepseek-v4-flash-vision-exp:
      provider: deepseek
      capabilities: [vision]
    glm-5.3:               { provider: glm }
    glm-5.3-flash:         { provider: glm }

  routes:
    classify: { primary: deepseek-flash, fallbacks: [glm-5.3-flash], temperature: 0.0, max_tokens: 1024 }
    chat:     { primary: deepseek-flash, fallbacks: [glm-5.3-flash], max_tokens: 4096 }
    plan:     { primary: glm-5.3,        fallbacks: [deepseek-v4-pro], max_tokens: 8192 }
    compress: { primary: glm-5.3,        fallbacks: [deepseek-v4-pro], max_tokens: 8192 }
    patch:    { primary: deepseek-flash, fallbacks: [deepseek-v4-flash], temperature: 0.0 }
    # 质量门禁：禁止降级到更便宜的模型，否则验证结论会被静默削弱
    verify:   { primary: deepseek-flash, fallbacks: [], allow_fallback: false, temperature: 0.0 }
    vision:   { primary: deepseek-v4-flash-vision-exp, fallbacks: [], allow_fallback: false, json_mode: false }

  # 价格表：占位值，务必按你的实际账单校准，否则预算治理器会守错数字
  pricing:
    default_input_cny_per_mtok: 2.0
    default_output_cny_per_mtok: 8.0

  admission:
    max_concurrency: 4
    interactive_reserved_slots: 1    # 批处理永远饿不死交互式请求
    low_priority_max_concurrency: 1
    queue_size: 20
    attempts_per_model: 2
    circuit_failure_threshold: 3
    circuit_recovery_seconds: 120
    request_deadline_seconds: 45
    max_retries: 2

  budget:
    daily_cost_cny: 20.0
    monthly_cost_cny: 300.0

retrieval:
  chroma_path: derived/chroma
  collection: papers_bge_m3   # 换嵌入模型必须换 collection，禁止原地覆盖
  reranker_enabled: true
  reranker_model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1

skills:
  # PPT：一次性子进程，绝不 import 进本进程（pptxgenjs 模块级状态串扰）。
  # 契约名 ppt-bridge/1，字段两侧同形，见 docs/contracts/04-ppt-skill.md。
  ppt-deck:
    runtime: subprocess
    isolated: true
    repo: D:/develop/project/PPTagent
    command: [npx, tsx]          # 发布态改成 [node] + dist/cli.js
    cli_entry: src/cli.ts
    timeout_s: 600
    facts_per_page: 3            # 与 FactSet.recommends_page_count 的默认值一致
    accept_padding: false        # 默认拒绝"信息量撑不住"的页数请求
    deck_root: primary/decks     # 交付物：不可重建 → primary（写入需审批）
    runs_root: derived/runs      # 中间态：request/response/报告

policy:
  # 本地文件外发默认拒绝，需显式放行
  allow_local_egress: false
  vault_write_channel: knowledge   # 唯一写入通道

external:
  research_agent: D:/develop/academic/research_agent
  knowledge_desktop: D:/develop/agent for obsidian
  ppt_agent: D:/develop/project/PPTagent
